<nav
  class="sidebar"
  [class.sidebar--collapsed]="isCollapsed()"
  [class.sidebar--expanded]="!isCollapsed()"
  aria-label="Organization navigation"
>
  <div class="sidebar__top">
    <a
      [routerLink]="homeLink()"
      class="sidebar__logo"
      aria-label="TeamHub home"
      [attr.data-tooltip]="isCollapsed() ? 'TeamHub home' : null"
    >
      <svg
        class="sidebar__logo-icon"
        viewBox="0 0 128 128"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          stroke="currentColor"
          stroke-width="28"
          stroke-linejoin="round"
          transform="translate(0,128) scale(0.1,-0.1)"
          d="M577 1270 c-48 -15 -98 -61 -119 -108 -17 -37 -19 -58 -15 -109 l6 -63 -144 0 c-132 0 -145 -2 -155 -19 -16 -30 -14 -932 3 -954 11 -16 50 -17 492 -15 l480 3 3 188 c3 212 3 213 -69 177 -102 -53 -211 13 -211 127 0 106 121 177 210 123 40 -25 58 -25 71 -2 13 24 13 330 0 354 -9 16 -24 18 -154 18 l-144 0 5 68 c5 58 3 73 -18 112 -34 63 -90 100 -159 105 -29 3 -67 0 -82 -5z m129 -66 c71 -34 97 -139 53 -211 -36 -58 -22 -63 162 -63 l159 0 0 -125 0 -125 -27 7 c-86 24 -184 -9 -230 -79 -24 -36 -28 -52 -28 -114 0 -64 3 -77 30 -115 50 -71 140 -101 228 -76 l27 7 0 -125 0 -125 -440 0 -440 0 0 435 0 435 159 0 c185 0 198 5 161 65 -78 127 52 273 186 209z"
        />
      </svg>
    </a>

    @if (!isCollapsed()) {
      <button
        type="button"
        class="sidebar__collapse-btn"
        (click)="toggleCollapsed()"
        aria-label="Collapse sidebar"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5" />
        </svg>
      </button>
    }
  </div>

  <ul class="sidebar__list">
    @for (item of items(); track item.id) {
      <li class="sidebar__group">
        <button
          type="button"
          class="sidebar__item"
          [class.sidebar__item--active]="isActiveBranch(item.id) && !(item.children?.length)"
          [class.sidebar__item--branch-active]="isActiveBranch(item.id) && !!(item.children?.length)"
          [attr.data-tooltip]="isCollapsed() ? item.label : null"
          [attr.aria-expanded]="item.children?.length ? isBranchOpen(item.id) : null"
          [attr.aria-current]="isActiveBranch(item.id) && !(item.children?.length) ? 'page' : null"
          (click)="onMainSelect(item)"
        >
          <span class="sidebar__icon" aria-hidden="true">
            @switch (item.icon) {
              @case ('members') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
              }
              @case ('organization') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6" />
                </svg>
              }
              @case ('teams') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
              }
              @case ('roles') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
              }
              @case ('statistic') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M4 19V5M10 19V9M16 19v-6M22 19V7" />
                </svg>
              }
              @case ('auditLog') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
                </svg>
              }
            }
          </span>

          @if (!isCollapsed()) {
            <span class="sidebar__label">{{ item.label }}</span>
            @if (item.children?.length) {
              <span
                class="sidebar__chevron"
                [class.sidebar__chevron--open]="isBranchOpen(item.id)"
                aria-hidden="true"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M9 18l6-6-6-6" />
                </svg>
              </span>
            }
          }
        </button>

        @if (!isCollapsed() && item.children?.length && isBranchOpen(item.id)) {
          <ul class="sidebar__children">
            @for (child of item.children; track child.id) {
              <li>
                <button
                  type="button"
                  class="sidebar__child"
                  [class.sidebar__child--active]="isChildActive(child.id)"
                  [attr.aria-current]="isChildActive(child.id) ? 'page' : null"
                  (click)="onChildSelect(child.id)"
                >
                  {{ child.label }}
                </button>
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>

  @if (isCollapsed()) {
    <button
      type="button"
      class="sidebar__expand-btn"
      data-tooltip="Expand sidebar"
      (click)="toggleCollapsed()"
      aria-label="Expand sidebar"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M13 17l5-5-5-5M6 17l5-5-5-5" />
      </svg>
    </button>
  }
</nav>
