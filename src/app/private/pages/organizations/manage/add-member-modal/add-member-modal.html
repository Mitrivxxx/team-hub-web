<div
  class="add-member-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-member-title"
  (click)="onBackdropClick($event)"
>
  <div class="add-member-modal__panel shadow-soft">
    <h2 id="add-member-title" class="add-member-modal__title">Add member</h2>

    @if (submitError()) {
      <p class="add-member-modal__error">{{ submitError() }}</p>
    }

    <div class="add-member-modal__form">
      <div class="add-member-modal__field">
        <label class="add-member-modal__label" for="add-member-user-id">User ID</label>
        <input
          id="add-member-user-id"
          class="add-member-modal__input"
          [ngModel]="userId()"
          (ngModelChange)="userId.set($event)"
          placeholder="User GUID"
        />
      </div>

      <div class="add-member-modal__field">
        <label class="add-member-modal__label" for="add-member-role-id">Role</label>
        <select
          id="add-member-role-id"
          class="add-member-modal__select"
          [ngModel]="roleId()"
          (ngModelChange)="roleId.set($event)"
        >
          <option value="">Select role</option>
          @for (role of orgRoles(); track role.id) {
            <option [value]="role.id">{{ role.name }}</option>
          }
        </select>
      </div>

      <div class="add-member-modal__actions">
        <button type="button" class="btn btn--outline" [disabled]="isSubmitting()" (click)="close()">
          Cancel
        </button>
        <button type="button" class="btn btn--primary" [disabled]="isSubmitting()" (click)="submit()">
          {{ isSubmitting() ? 'Adding...' : 'Add member' }}
        </button>
      </div>
    </div>
  </div>
</div>
