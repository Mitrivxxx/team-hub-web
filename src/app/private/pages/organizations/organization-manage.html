<main
  class="org-manage"
  [class.org-manage--sidebar-expanded]="!sidebarCollapsed()"
>
  <div class="org-manage__layout">
    <app-sidebar
      class="org-manage__sidebar"
      [items]="navItems"
      [activeId]="activeTab()"
      [collapsed]="sidebarCollapsed()"
      (itemSelect)="onTabSelect($event)"
      (collapsedChange)="onSidebarCollapsedChange($event)"
    />

    <div class="org-manage__content">
      @if (isLoading()) {
        <p class="org-manage__status" aria-live="polite">Loading...</p>
      } @else if (loadError()) {
        <div class="org-manage__status org-manage__status--error">
          <p>{{ loadError() }}</p>
          <a routerLink="/app" class="btn btn--outline">Back to organizations</a>
        </div>
      } @else {
        <header class="org-manage__page-header">
          <div class="org-manage__page-intro">
            <h1 class="org-manage__page-title">{{ pageChrome().title }}</h1>
            <p class="org-manage__page-description">{{ pageChrome().description }}</p>
          </div>
          @if (pageChrome().primaryAction; as action) {
            <button type="button" class="btn btn--primary org-manage__page-action" (click)="onPrimaryAction()">
              {{ action.label }}
            </button>
          }
        </header>

        <div class="org-manage__page-body">
          <p>Content for this section will be added later.</p>
        </div>
      }
    </div>
  </div>
</main>
