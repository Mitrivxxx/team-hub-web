<main class="dashboard section">
  <div class="container">
    <header class="dashboard__header">
      <p class="dashboard__eyebrow">TeamHub App</p>
      <h1 class="dashboard__title">Dashboard</h1>
      <p class="dashboard__description">
        Wybierz serwis, z ktorego chcesz teraz skorzystac.
      </p>
    </header>

    <section class="dashboard__grid" aria-label="Dostepne serwisy">
      @for (service of services; track service.route) {
        <article class="dashboard-card shadow-soft">
          <h2 class="dashboard-card__title">{{ service.title }}</h2>
          <p class="dashboard-card__description">{{ service.description }}</p>
          <a [routerLink]="service.route" class="btn btn--primary dashboard-card__cta">
            {{ service.ctaLabel }}
          </a>
        </article>
      }
    </section>
  </div>
</main>
