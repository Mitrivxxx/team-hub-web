@if (!authService.sessionReady()) {
  <app-loader />
} @else {
  <div class="app-layout" [class.app-layout--auth]="!showLayout()">
    @if (showLayout()) {
      <app-header />
    }
    <div class="app-layout__content">
      <router-outlet />
    </div>
    @if (showFooter()) {
      <app-footer />
    }
  </div>
}
