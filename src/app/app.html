@if (!authService.sessionReady()) {
  <app-loader />
} @else {
  <div
    class="app-layout"
    [class.app-layout--auth]="!showLayout()"
    [class.app-layout--org-manage]="orgManageLayout.active()"
    [style.--org-manage-sidebar-width.px]="orgManageLayout.sidebarWidthPx()"
  >
    @if (showLayout()) {
      <app-header />
    }
    <div class="app-layout__content">
      <router-outlet />
    </div>
    @if (showFooter()) {
      <app-footer />
    }
  </div>
}
